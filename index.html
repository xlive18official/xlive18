<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0d">
  <meta name="description" content="XLive 18 — منصة اجتماعية وترفيهية للبالغين.">
  <title>XLive 18 — منصتك الاجتماعية</title>
  <link rel="stylesheet" href="./styles.css?v=20261012-6">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js?v=20261012-6"></script>
  <script src="./app.js?v=20261012-6" defer></script>
  <script src="./auth.js?v=20261012-6" defer></script>
  <script src="./site-editor.js?v=20261012-6" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="التنقل الرئيسي">
      <a class="brand" href="#home" data-view="home" aria-label="XLive 18 الرئيسية"><span class="brand-mark">X</span><span>LIVE <b>18</b></span></a>
      <p class="sidebar-label">القائمة الرئيسية</p>
      <button class="nav-item" data-view="editor" hidden><span class="nav-icon">✎</span>تعديل الموقع</button>
      <nav class="nav-list">
        <button class="nav-item active" data-view="home"><span class="nav-icon">⌂</span>الرئيسية</button>
        <button class="nav-item" data-view="clips"><span class="nav-icon">▷</span>المقاطع</button>
        <button class="nav-item" data-view="rooms"><span class="nav-icon">◉</span>الغرف</button>
        <button class="nav-item" data-view="live"><span class="nav-icon">●</span>البث المباشر</button>
        <button class="nav-item" data-view="messages"><span class="nav-icon">✉</span>الرسائل</button>
        <button class="nav-item" data-view="notifications"><span class="nav-icon">♧</span>الإشعارات</button>
        <button class="nav-item" data-view="saved"><span class="nav-icon">♡</span>المحفوظات</button>
      </nav>
      <div class="sidebar-bottom">
        <button class="nav-item" data-view="profile"><span class="nav-icon">◎</span>ملفي الشخصي</button>
        <button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span>الإعدادات</button>
        <div class="sidebar-note"><span class="status-dot"></span><span>نسخة تأسيسية<br><small>الخدمات الخلفية غير متصلة بعد</small></span></div>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <button class="mobile-brand" data-view="home" aria-label="الرئيسية"><span class="brand-mark">X</span><span>LIVE <b>18</b></span></button>
        <form class="search-form" id="search-form" role="search">
          <span aria-hidden="true">⌕</span>
          <input id="global-search" type="search" placeholder="ابحث عن حساب بالاسم أو اسم المستخدم..." aria-label="البحث عن الحسابات">
          <button type="submit">بحث</button>
        </form>
        <div class="top-actions">
          <button class="icon-button" data-view="notifications" aria-label="الإشعارات">♧</button>
          <button class="profile-chip" data-view="profile"><span class="avatar-placeholder">؟</span><span>حسابي</span></button>
        </div>
      </header>

      <section class="content-wrap" id="app-view" aria-live="polite">
        <div class="initial-loading" role="status" aria-live="polite">
          <span class="brand-mark">X</span>
          <p>جارٍ تجهيز XLIVE 18…</p>
        </div>
      </section>
    </main>
  </div>
  <nav class="mobile-nav" aria-label="التنقل للهاتف">
    <button class="active" data-view="home"><span>⌂</span>الرئيسية</button><button data-view="clips"><span>▷</span>المقاطع</button><button data-view="rooms"><span>◉</span>الغرف</button><button data-view="messages"><span>✉</span>الرسائل</button><button data-view="saved"><span>♡</span>المحفوظات</button><button data-view="profile"><span>◎</span>حسابي</button><button data-view="editor" hidden><span>✎</span>تعديل الموقع</button>
  </nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
