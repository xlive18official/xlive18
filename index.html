<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0d">
  <meta name="description" content="XLive 18 — منصة اجتماعية وترفيهية للبالغين.">
  <title>XLive 18 — منصتك الاجتماعية</title>
  <link rel="stylesheet" href="./styles.css?v=20261021-01">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js?v=20261017-47"></script>
  <script src="./app.js?v=20261021-01" defer></script>
  <script src="./auth.js?v=20261021-01" defer></script>
  <script src="./batch-video-upload.js?v=20261019-02" defer></script>
  <script src="./admin.js?v=20261021-01" defer></script>
  <script src="./account-controls.js?v=20261017-47" defer></script>
  <script src="./site-editor.js?v=20261017-47" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="التنقل الرئيسي">
      <div class="sidebar-heading"><a class="brand" href="#home" data-view="home" aria-label="XLive 18 الرئيسية"><span class="brand-mark">X</span><span>LIVE <b>18</b></span></a><button class="sidebar-close" id="sidebar-close" type="button" aria-label="إغلاق القائمة">←</button></div>
      <nav class="nav-list" aria-label="روابط الحساب">
        <button class="nav-item" data-view="creator"><span class="nav-icon">▣</span>الصفحة الشخصية</button>
        <button class="nav-item" data-view="saved"><span class="nav-icon">♡</span>المحفوظات</button>
        <button class="nav-item" data-view="profile"><span class="nav-icon">◎</span>حسابي</button>
      </nav>
      <div class="sidebar-bottom">
        <button class="nav-item" data-view="admin" id="admin-nav" aria-label="فتح لوحة الإدارة"><span class="nav-icon">⚙</span>الإدارة</button>
        <button class="nav-item sidebar-signout" id="auth-signout" type="button" hidden><span class="nav-icon">↪</span>تسجيل الخروج</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <button class="mobile-menu-toggle" id="mobile-menu-toggle" type="button" aria-label="فتح القائمة الجانبية" aria-expanded="false">☰</button>
        <button class="mobile-brand" data-view="home" aria-label="الرئيسية"><span class="brand-mark">X</span><span>LIVE <b>18</b></span></button>
        <form class="search-form" id="search-form" role="search">
          <span aria-hidden="true">⌕</span>
          <input id="global-search" type="search" placeholder="ابحث عن حساب بالاسم أو اسم المستخدم..." aria-label="البحث عن الحسابات">
          <button type="submit">بحث</button>
        </form>
        <div class="top-actions">
          <button class="icon-button" data-view="notifications" aria-label="الإشعارات">♧</button>
          <button class="profile-chip" data-view="profile"><span class="avatar-placeholder">؟</span><span>حسابي</span></button>
        </div>
      </header>

      <section class="content-wrap" id="app-view" aria-live="polite">
        <div class="initial-loading" role="status" aria-live="polite">
          <span class="brand-mark">X</span>
          <p>جارٍ تجهيز XLIVE 18…</p>
        </div>
      </section>
    </main>
  </div>
  <nav class="mobile-nav" aria-label="التنقل للهاتف">
    <button class="active" data-view="home"><span>⌂</span>الرئيسية</button><button data-view="clips"><span>▷</span>المقاطع</button><button data-view="rooms"><span>◉</span>الغرف</button><button data-view="messages"><span>✉</span>الرسائل</button><button data-view="editor" hidden><span>✎</span>تعديل الموقع</button>
  </nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
  (() => {
    const button = document.getElementById('mobile-menu-toggle');
    const closeButton = document.getElementById('sidebar-close');
    if (!button) return;
    const close = () => {
      document.body.classList.remove('mobile-menu-open');
      button.setAttribute('aria-expanded', 'false');
      button.setAttribute('aria-label', 'فتح القائمة الجانبية');
      button.textContent = '☰';
    };
    closeButton?.addEventListener('click', (event) => { event.preventDefault(); close(); });
    button.addEventListener('click', (event) => {
      event.preventDefault();
      event.stopPropagation();
      const opening = !document.body.classList.contains('mobile-menu-open');
      document.body.classList.toggle('mobile-menu-open', opening);
      button.setAttribute('aria-expanded', String(opening));
      button.setAttribute('aria-label', opening ? 'إغلاق القائمة الجانبية' : 'فتح القائمة الجانبية');
      button.textContent = opening ? '×' : '☰';
    });
    document.addEventListener('click', (event) => {
      if (event.target.closest('.sidebar [data-view]')) close();
      if (document.body.classList.contains('mobile-menu-open') &&
          !event.target.closest('.sidebar') &&
          !event.target.closest('#mobile-menu-toggle')) close();
    });
    document.addEventListener('keydown', (event) => { if (event.key === 'Escape') close(); });
  })();
  </script>
</body>
</html>
